[package]
name = "rzen"
version = "0.1.1"
description = "A fast, memory-lean, Zen-style browser built on the native system engine"
edition = "2024"
license = "MIT"
repository = "https://github.com/broisnischal/rzen"

[dependencies]
dirs = "7"
muda = "0.21"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tao = "0.37"
url = "2"
wry = { version = "0.57", features = ["devtools", "mac-proxy"] }

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
libc = "0.2"
objc2 = "0.6"
objc2-app-kit = "0.3"
objc2-foundation = "0.3"
objc2-quartz-core = "0.3"
objc2-user-notifications = "0.3"
objc2-web-kit = "0.3"
security-framework = "3"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "debuginfo"

[profile.dev.package."*"]
opt-level = 2
