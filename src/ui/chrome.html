<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>rzen</title>
<style>
:root {
  color-scheme: light dark;
  --sw: 252px; --gap: 8px; --fx: 252px; --rx: 8px; --aiw: 380px;
  --bg: #fff; --fg: #0a0a0a;
  --fg2: oklch(0 0 0 / 0.55); --fg3: oklch(0 0 0 / 0.35);
  --hover: oklch(0 0 0 / 0.04); --press: oklch(0 0 0 / 0.07); --selected: oklch(0 0 0 / 0.07);
  --field: oklch(0 0 0 / 0.045); --line: oklch(0 0 0 / 0.1);
  --raised: #fff; --scrim: oklch(0 0 0 / 0.2);
  --ease: cubic-bezier(0.2, 0, 0, 1);
  /* type scale: captions, labels, UI text, card titles, the command bar */
  --t-xs: 11px; --t-sm: 12px; --t-md: 13px; --t-lg: 15px; --t-xl: 17px;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #000; --fg: #fafafa;
    --fg2: oklch(1 0 0 / 0.55); --fg3: oklch(1 0 0 / 0.35);
    --hover: oklch(1 0 0 / 0.06); --press: oklch(1 0 0 / 0.1); --selected: oklch(1 0 0 / 0.11);
    --field: oklch(1 0 0 / 0.07); --line: oklch(1 0 0 / 0.13);
    --raised: #121212; --scrim: oklch(0 0 0 / 0.45);
  }
}
* { box-sizing: border-box; margin: 0; padding: 0; cursor: default; }
[hidden] { display: none !important; }
html, body { height: 100%; overflow: hidden; background: transparent; }
html { -webkit-font-smoothing: antialiased; }
body {
  font: var(--t-md)/1.3 -apple-system, BlinkMacSystemFont, "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
  color: var(--fg); -webkit-user-select: none; user-select: none;
}
.no-transitions *, .no-transitions *::before, .no-transitions *::after { transition: none !important; }
img { -webkit-user-drag: none; }
svg { width: 16px; height: 16px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; pointer-events: none; }
/* 24-unit icons drawn at 16px: 2.25 units = the same 1.5px stroke as the rest */
svg.i24 { stroke-width: 2.25; }
button {
  font: inherit; color: inherit; background: none; border: 0; border-radius: 6px;
  display: inline-flex; align-items: center; justify-content: center;
  transition-property: background-color, color, scale; transition-duration: 150ms; transition-timing-function: var(--ease);
}
button:disabled { opacity: 0.3; }
input, textarea { font: inherit; color: inherit; background: none; border: 0; outline: none; -webkit-user-select: text; user-select: text; cursor: text; }
:focus-visible { outline: 2px solid var(--fg); outline-offset: 1px; }
input:focus-visible { outline: none; }
/* standalone fields keep a visible focus ring (inline ones sit in an already-focused bar) */
#keycard input:focus-visible, #wshead input:focus-visible, #gate input:focus-visible { box-shadow: inset 0 0 0 2px var(--fg2); }
@media (hover: hover) {
  button:not(:disabled):hover, .tab:hover, .ess:hover { background-color: var(--hover); }
  .icon-btn:not(:disabled):hover { color: var(--fg); }
}
button:not(:disabled):active { background-color: var(--press); }
@media (prefers-reduced-motion: no-preference) {
  button:not(:disabled):active, .ess:active { scale: 0.96; }
}

/* ---------- content frame: sits under the native page view. The window paints the
   black/white background natively, so every page area stays see-through for the
   command-bar overlay; a 1px hairline marks the page edge. ---------- */
#frame {
  position: fixed; inset-block: var(--gap); inset-inline: var(--fx) var(--rx); z-index: 0;
  border-radius: 10px;
  box-shadow: 0 0 0 1px var(--line);
  display: grid; place-items: center;
}
.empty #frame { background: var(--bg); }
#emptymsg { display: none; text-align: center; color: var(--fg2); }
.empty #emptymsg { display: block; }
#emptymsg h1 { font-size: 28px; font-weight: 600; letter-spacing: -0.02em; color: var(--fg); margin-bottom: 8px; }
kbd { font: inherit; font-weight: 500; color: var(--fg); padding: 1px 6px; border-radius: 5px; background: var(--field); }

/* ---------- sidebar ---------- */
#sidebar {
  position: fixed; inset-block: 0; inset-inline-start: 0; width: var(--sw); z-index: 1;
  display: flex; flex-direction: column; padding: 0 8px 8px;
}
@media (prefers-reduced-motion: no-preference) {
  body:not(.animating) #sidebar { transition: translate 150ms var(--ease); }
}
.titlebar { height: 44px; flex: none; display: flex; align-items: center; justify-content: flex-end; gap: 2px; padding-inline: 84px 4px; }
.no-traffic .titlebar { padding-inline-start: 4px; }
.icon-btn { width: 28px; height: 28px; color: var(--fg2); }

#urlbar {
  flex: none; height: 34px; margin-block: 2px 12px; border-radius: 8px; background: var(--field);
  display: flex; align-items: center; padding-inline-end: 4px; color: var(--fg2);
  position: relative; overflow: hidden; transition: background-color 150ms var(--ease);
}
@media (hover: hover) { #urlbar:hover { background: var(--press); } }
#u-main, #u-main:hover, #u-main:active { flex: 1; min-width: 0; height: 100%; justify-content: flex-start; gap: 8px; padding-inline: 10px 6px; color: var(--fg2); background: none; border-radius: 0; scale: none; }
#u-icon { width: 16px; height: 16px; flex: none; display: grid; place-items: center; }
.u-act { width: 26px; height: 26px; border-radius: 4px; flex: none; color: var(--fg2); opacity: 0; transition-property: opacity, color, background-color; }
@media (hover: hover) { #urlbar:hover .u-act { opacity: 1; } .u-act:hover { color: var(--fg); } }
#urlbar:focus-within .u-act { opacity: 1; }
#urlbar.blank .u-act, .no-share #u-share { display: none; }
#u-copy { position: relative; }
#u-copy svg { position: absolute; transition: opacity 200ms var(--ease), scale 200ms var(--ease), filter 200ms var(--ease); }
#u-copy .i-b, #u-copy.done .i-a { opacity: 0; scale: 0.25; filter: blur(4px); }
#u-copy.done .i-b { opacity: 1; scale: 1; filter: none; }
#u-copy.done { opacity: 1; color: var(--fg); }
#host { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--fg); font-weight: 500; }
#host.placeholder { color: var(--fg2); font-weight: 400; }
#urlbar::after { content: ''; position: absolute; inset-inline-start: 0; bottom: 0; height: 2px; width: 30%; background: var(--fg); opacity: 0; }
.loading #urlbar::after { opacity: 0.6; animation: progress 1.2s linear infinite; }
@keyframes progress { from { translate: -100% 0; } to { translate: 340% 0; } }

#findbar { display: none; flex: none; height: 34px; margin-block: -4px 12px; border-radius: 8px; background: var(--field); align-items: center; padding-inline: 10px 4px; gap: 0; }
.finding #findbar { display: flex; }
#findbar input { flex: 1; min-width: 0; }
#findbar.miss { box-shadow: inset 0 0 0 1px var(--fg2); }
#findbar.miss input { color: var(--fg2); }
#findbar .icon-btn { width: 26px; height: 26px; border-radius: 4px; }

/* Essentials: borderless tiles. The open one is a step brighter with a short bar under its
   icon (no outline ring), so the row stays calm. */
#essentials { flex: none; display: grid; grid-template-columns: repeat(auto-fill, minmax(56px, 1fr)); gap: 8px; margin-bottom: 16px; }
#essentials:empty { display: none; }
.ess { height: 48px; border-radius: 12px; background: var(--field); display: grid; place-items: center; position: relative; transition: scale 150ms var(--ease), background-color 150ms var(--ease); }
@media (hover: hover) { .ess:hover { background-color: oklch(from var(--fg) l c h / 0.1); } }
.ess.active, .ess.active:hover { background-color: oklch(from var(--fg) l c h / 0.16); }
.ess::after { content: ''; position: absolute; bottom: 6px; inset-inline-start: 50%; width: 12px; height: 2px; border-radius: 1px; background: var(--fg); translate: -50% 0; opacity: 0; scale: 0.5 1; transition: opacity 150ms var(--ease), scale 150ms var(--ease); }
.ess.active::after { opacity: 1; scale: 1; }
.ess .fav { width: 22px; height: 22px; }
.ess.active .fav { translate: 0 -2px; }
@media (prefers-reduced-motion: no-preference) { .ess .fav { transition: translate 150ms var(--ease); } }

#wshead { flex: none; display: flex; align-items: center; height: 28px; padding-inline: 10px; margin-bottom: 2px; font-size: var(--t-sm); font-weight: 600; color: var(--fg2); }
#wshead .name { flex: 1; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
#wshead input { flex: 1; font-weight: 600; color: var(--fg); background: var(--field); border-radius: 6px; padding: 3px 6px; margin-inline-start: -6px; }

#scroll { flex: 1; min-height: 0; overflow-y: auto; overflow-x: hidden; margin-inline: -4px; padding-inline: 4px; }
#scroll::-webkit-scrollbar { width: 0; }
/* switching spaces: the tab list slides in from the side you swiped toward */
@keyframes ws-in { from { translate: var(--ws-from) 0; opacity: 0; } }
@media (prefers-reduced-motion: no-preference) { #scroll.ws-in { animation: ws-in 200ms var(--ease); } }
.list { display: flex; flex-direction: column; gap: 2px; min-height: 2px; position: relative; }
.divider { height: 1px; background: var(--line); margin: 8px 10px; flex: none; }
#pinned:empty + .divider { display: none; }

.tab {
  height: 34px; flex: none; border-radius: 8px; display: flex; align-items: center; gap: 10px;
  padding-inline: 10px 6px; position: relative; transition: background-color 150ms var(--ease);
}
.tab.active { background: var(--selected); }
.tab .title { flex: 1; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.tab.active .title { font-weight: 500; }
.tab.unloaded .title { color: var(--fg2); }
.tab.unloaded .fav, .ess.unloaded .fav { opacity: 0.6; }
.close { width: 24px; height: 24px; color: var(--fg2); opacity: 0; transition-property: opacity, color, background-color, scale; }
.tab.active .close, .tab:focus-within .close { opacity: 1; }
@media (hover: hover) { .tab:hover .close { opacity: 1; } .close:hover { color: var(--fg); } }
.drop-before::before { content: ''; position: absolute; inset-inline: 6px; top: -2px; height: 2px; border-radius: 1px; background: var(--fg); }
.ess.drop-before::before { inset-inline: -4px auto; top: 8px; bottom: 8px; width: 2px; height: auto; }
.list.drop-end { box-shadow: inset 0 -2px 0 var(--fg); }
.tab.dragging, .ess.dragging { opacity: 0; }
@media (prefers-reduced-motion: no-preference) { .tab-drag .list > .tab { transition: transform 180ms var(--ease), background-color 150ms var(--ease); } }
.tab.drag-ghost, .ess.drag-ghost { position: fixed; z-index: 50; pointer-events: none; margin: 0; transition: none; background: var(--raised); box-shadow: 0 0 0 1px var(--line), 0 8px 24px oklch(0 0 0 / 0.16); }
.tab-drag, .tab-drag * { cursor: grabbing !important; }

.fav { width: 16px; height: 16px; flex: none; border-radius: 4px; display: grid; place-items: center; font-size: 10px; font-weight: 600; position: relative; }
.fav.letter { background: var(--field); color: var(--fg2); box-shadow: inset 0 0 0 1px var(--line); }
.fav svg { color: var(--fg2); }
.fav img { width: 100%; height: 100%; object-fit: contain; border-radius: 3px; }
/* While loading, a spinner takes the favicon's place (never a ring around it). */
.loading-tab .fav > * { visibility: hidden; }
.loading-tab .fav { background: none; box-shadow: none; color: transparent; }
.loading-tab .fav::after { content: ''; position: absolute; inset: 1px; border-radius: 50%; border: 1.5px solid var(--fg3); border-top-color: var(--fg); animation: spin 0.7s linear infinite; }
@keyframes spin { to { rotate: 360deg; } }

#newtab { width: 100%; height: 34px; justify-content: flex-start; gap: 10px; padding-inline: 10px; color: var(--fg2); border-radius: 8px; flex: none; }

/* Toast: floats over the bottom of the tab list (never the player or the bottom bar), so
   nothing jumps when it appears. `bottom` is set from the list's edge when it shows. */
#toast {
  position: absolute; inset-inline: 8px; bottom: 44px; z-index: 2; min-height: 32px; display: flex; align-items: center; gap: 2px;
  padding-block: 4px; padding-inline: 12px 4px; border-radius: 8px; font-size: var(--t-sm); background: var(--fg); color: var(--bg);
  opacity: 0; translate: 0 4px; pointer-events: none;
}
#toast.show { opacity: 1; translate: none; pointer-events: auto; }
@media (prefers-reduced-motion: no-preference) { #toast { transition: opacity 150ms var(--ease), translate 150ms var(--ease); } }
#toast .tt { flex: 1; min-width: 0; padding-block: 4px; line-height: 1.35; text-wrap: pretty; }
#toast:not(:has(button)) { padding-inline-end: 12px; }
#toast button { height: 24px; flex: none; padding-inline: 8px; border-radius: 4px; color: var(--bg); font-weight: 600; }
#toast .tx { width: 24px; padding: 0; font-weight: 400; }
@media (hover: hover) { #toast button:hover { background-color: oklch(from var(--bg) l c h / 0.16); } }
#toast button:active { background-color: oklch(from var(--bg) l c h / 0.24); }
#toast button:focus-visible { outline-color: var(--bg); outline-offset: -2px; }

/* 28px row + the sidebar's 8px bottom padding = centered 22px from the bottom, mirroring the top row.
   Three groups: you (leading), your spaces (centred on the sidebar), tools (trailing). */
.bottombar { flex: none; height: 36px; display: grid; grid-template-columns: 1fr minmax(0, auto) 1fr; align-items: center; gap: 12px; padding: 8px 4px 0; }
.bottombar .lead { display: flex; justify-self: start; }
.bottombar .spaces { display: flex; align-items: center; min-width: 0; }
.bottombar .trail { display: flex; align-items: center; gap: 4px; justify-self: end; }
#wslist { display: flex; align-items: center; gap: 0; overflow-x: auto; min-width: 0; }
#wslist::-webkit-scrollbar { height: 0; }
#wslist { flex: 0 1 auto; }
.wsb { width: 24px; height: 28px; flex: none; border-radius: 6px; }
.wsb span { width: 6px; height: 6px; border-radius: 3px; background: var(--fg3); transition: width 200ms var(--ease), background-color 150ms var(--ease); }
.wsb.active span { width: 16px; background: var(--fg); }
.wsb.drop span { width: 16px; background: var(--fg2); }
.mini { width: 24px; height: 28px; flex: none; color: var(--fg3); }
.mini svg { width: 12px; height: 12px; }
@media (hover: hover) { .mini:hover { color: var(--fg); } }

#resizer { position: absolute; inset-block: 0; inset-inline-end: -3px; width: 8px; cursor: col-resize; }

/* compact mode: the sidebar is a floating card parked off-screen (far enough that its shadow
   doesn't show); hovering the window edge slides it in. Only translate changes, so the card
   moves in and out as one piece instead of its background and corners popping. */
.compact #sidebar {
  translate: calc(-100% - 40px) 0; inset-block: 6px; inset-inline-start: 6px; border-radius: 14px; padding-inline: 6px;
  background: var(--raised); box-shadow: 0 0 0 1px var(--line), 0 8px 24px oklch(0 0 0 / 0.16), 0 2px 6px oklch(0 0 0 / 0.08);
}
.compact #resizer { display: none; }
.compact.peek #sidebar { translate: none; }
#edge { position: fixed; inset-block: 0; inset-inline-start: 0; width: 9px; display: none; z-index: 2; }
.compact:not(.peek) #edge { display: block; }

/* ---------- command bar ---------- */
#pwrap { position: fixed; inset: 0; display: none; z-index: 3; }
.palette #pwrap { display: block; }
#backdrop { position: absolute; inset: 0; background: var(--scrim); }
#palette {
  position: absolute; top: 18vh; inset-inline-start: 50%; translate: -50% 0;
  width: min(620px, calc(100vw - 40px)); border-radius: 14px; background: var(--raised); overflow: hidden;
  box-shadow: 0 0 0 1px var(--line), 0 16px 48px oklch(0 0 0 / 0.22), 0 4px 12px oklch(0 0 0 / 0.1);
}
@media (prefers-reduced-motion: no-preference) {
  #backdrop { animation: fade 150ms var(--ease); }
  #palette { animation: rise 150ms var(--ease); }
}
@keyframes fade { from { opacity: 0; } }
@keyframes rise { from { opacity: 0; translate: -50% -6px; } }
.pin { display: flex; align-items: center; gap: 10px; height: 52px; padding-inline: 16px; color: var(--fg2); }
#pinput { flex: 1; font-size: var(--t-xl); min-width: 0; color: var(--fg); }
#pinput::placeholder { color: var(--fg3); }
#results { border-top: 1px solid var(--line); padding: 6px; max-height: 52vh; overflow-y: auto; }
#results:empty { display: none; }
.res { height: 40px; border-radius: 8px; display: flex; align-items: center; gap: 12px; padding-inline: 10px; }
.res[aria-selected="true"] { background: var(--selected); }
.res .fav { width: 16px; height: 16px; color: var(--fg2); }
.res .t { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; flex: 0 1 auto; max-width: 60%; }
.res .u { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; flex: 1; color: var(--fg2); font-size: var(--t-sm); }
.res .hint { color: var(--fg2); font-size: var(--t-sm); flex: none; }
.res .hint.keys { font-variant-numeric: tabular-nums; letter-spacing: 0.04em; padding: 2px 6px; border-radius: 5px; background: var(--field); }
/* no overlay (Windows): the command bar lives inside the sidebar */
.no-overlay #backdrop { display: none; }
.no-overlay #palette { inset-inline-start: 8px; top: 44px; translate: none; width: calc(var(--sw) - 14px); animation: none; }
.no-overlay .res .u { display: none; }

/* ---------- AI panel: header from the chrome; body is either rzen AI (drawn here) or a
   provider's page (a native view laid over .body) ---------- */
#ai { position: fixed; inset-block: var(--gap); inset-inline-end: var(--gap); width: var(--aiw); z-index: 1; display: none; flex-direction: column; }
.ai-open #ai { display: flex; }
/* rzen AI (drawn here) slides in from its edge; a provider's page is a native view and just appears. */
@media (prefers-reduced-motion: no-preference) { .ai-open.ai-assistant #ai { animation: ai-in 180ms var(--ease); } }
@keyframes ai-in { from { opacity: 0; translate: 8px 0; } }
#ai .head { height: 44px; flex: none; display: flex; align-items: center; gap: 2px; padding-block-end: 8px; }
#ai .grow { flex: 1; }
#ai-pick { height: 28px; gap: 6px; padding-inline: 8px 6px; font-weight: 600; max-width: 70%; }
#ai-pick span { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
#ai-pick .chev { width: 12px; height: 12px; color: var(--fg2); }
#ai .body { flex: 1; min-height: 0; border-radius: 10px; box-shadow: 0 0 0 1px var(--line); display: flex; flex-direction: column; overflow: hidden; }
#ai-resizer { position: absolute; inset-block: 0; inset-inline-start: -7px; width: 8px; cursor: col-resize; }
#chat { display: none; flex: 1; min-height: 0; flex-direction: column; }
.ai-assistant #chat { display: flex; }
#msgs { flex: 1; min-height: 0; overflow-y: auto; line-height: 1.45; padding: 16px 14px 8px; display: flex; flex-direction: column; gap: 14px; user-select: text; -webkit-user-select: text; }
#msgs * { cursor: auto; }
.intro { margin: auto 0; display: flex; flex-direction: column; gap: 8px; }
.intro h2 { font-size: var(--t-lg); font-weight: 600; }
.intro p { color: var(--fg2); margin-bottom: 6px; }
.chip { display: block; width: 100%; text-align: start; justify-content: flex-start; padding: 8px 10px; border-radius: 8px; box-shadow: inset 0 0 0 1px var(--line); color: var(--fg); }
.m-user { align-self: flex-end; max-width: 88%; padding: 8px 12px; border-radius: 12px; background: var(--field); white-space: pre-wrap; overflow-wrap: anywhere; }
.m-ai { line-height: 1.5; overflow-wrap: anywhere; }
.m-ai p + p, .m-ai p + ul, .m-ai ul + p, .m-ai pre { margin-top: 8px; }
.m-ai ul, .m-ai ol { padding-inline-start: 18px; margin-top: 4px; }
.m-ai code { font: var(--t-sm) ui-monospace, SFMono-Regular, Menlo, monospace; background: var(--field); padding: 1px 4px; border-radius: 4px; }
.m-ai pre { background: var(--field); border-radius: 8px; padding: 8px 10px; overflow-x: auto; }
.m-ai pre code { background: none; padding: 0; }
.m-ai a { color: var(--fg); text-decoration: underline; text-underline-offset: 2px; cursor: pointer; }
.step { display: flex; align-items: center; gap: 8px; font-size: var(--t-sm); color: var(--fg2); }
.step svg { width: 13px; height: 13px; }
.step .st { width: 12px; height: 12px; flex: none; display: grid; place-items: center; }
.step.run .st::after { content: ''; width: 9px; height: 9px; border-radius: 50%; border: 1.5px solid var(--fg3); border-top-color: var(--fg); animation: spin 0.7s linear infinite; }
.step.ok .st::after { content: '✓'; font-size: var(--t-xs); color: var(--fg); }
.step.err .st::after { content: '!'; font-size: var(--t-xs); font-weight: 700; color: var(--fg); }
.note { font-size: var(--t-sm); color: var(--fg2); font-style: italic; }
.notice { font-size: var(--t-sm); padding: 8px 10px; border-radius: 8px; box-shadow: inset 0 0 0 1px var(--line); }
#composer { flex: none; margin: 4px; padding: 8px; border-radius: 6px; background: var(--field); display: flex; flex-direction: column; gap: 6px; }
#ctx { align-self: flex-start; max-width: 100%; height: 24px; gap: 6px; padding-inline: 8px 10px; border-radius: 12px; font-size: var(--t-sm); color: var(--fg2); box-shadow: inset 0 0 0 1px var(--line); }
#ctx[aria-pressed="false"] { opacity: 0.55; text-decoration: line-through; }
#ctx span { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
#ctx svg { width: 12px; height: 12px; }
#ai-input { width: 100%; resize: none; min-height: 20px; max-height: 160px; line-height: 1.4; padding: 2px 4px; }
#ai-input::placeholder { color: var(--fg3); }
#composer .row { display: flex; align-items: center; gap: 6px; }
#ai-model { flex: 1; font-size: var(--t-xs); color: var(--fg3); padding-inline: 4px; }
#ai-send { width: 28px; height: 28px; border-radius: 50%; background: var(--fg); color: var(--bg); }
#ai-send:disabled { opacity: 0.25; background: var(--fg); }
#ai-send .i-stop, .running #ai-send .i-up { display: none; }
.running #ai-send .i-stop { display: inline; }
#keycard { display: flex; flex-direction: column; gap: 10px; margin: auto 0; }
#keycard h2 { font-size: var(--t-lg); font-weight: 600; }
#keycard p { color: var(--fg2); }
#keycard input { height: 34px; border-radius: 8px; background: var(--field); padding-inline: 10px; }
#keycard .row { display: flex; gap: 8px; }
#keycard .primary { flex: 1; height: 34px; border-radius: 8px; background: var(--fg); color: var(--bg); font-weight: 600; }
#keycard .link { height: 34px; padding-inline: 10px; color: var(--fg2); }

/* ---------- media mini player ---------- */
#player {
  position: relative; isolation: isolate; overflow: hidden; flex: none; display: none; flex-direction: column; gap: 8px;
  margin-top: 8px; padding: 8px; border-radius: 18px; background: var(--field);
}
/* LED-style pixel spectrum behind the controls while something plays (drawn by fxFrame) */
#m-fx { position: absolute; inset: 0; width: 100%; height: 100%; z-index: -1; pointer-events: none; }
.has-media #player { display: flex; }
@media (prefers-reduced-motion: no-preference) { .has-media #player { animation: rise-in 200ms var(--ease); } }
@keyframes rise-in { from { opacity: 0; translate: 0 4px; } }
/* the docked page view sits exactly on #m-video; its native corner radius is 10 (outer 18 = 10 + 8 padding) */
/* sized to the video's own shape (set from the page); tall videos stay ≤ 240px high, centred */
#m-video { display: none; width: 100%; max-width: var(--mv-max, none); align-self: center; aspect-ratio: var(--mv-ratio, 16 / 9); border-radius: 10px; background: #000; }
#player.has-video #m-video { display: block; }
#player.has-video #m-art { display: none; }
#player .top { display: flex; align-items: center; gap: 12px; min-width: 0; padding: 2px 4px 0; }
#m-art { width: 40px; height: 40px; flex: none; padding: 0; border-radius: 8px; overflow: hidden; background: var(--field); outline: 1px solid var(--line); outline-offset: -1px; transition: scale 300ms var(--ease); }
#player:not(.playing) #m-art { scale: 0.92; }
#m-art canvas { display: block; width: 100%; height: 100%; image-rendering: pixelated; filter: grayscale(1) contrast(1.15); }
#m-art svg { color: var(--fg2); }
#player .meta { flex: 1; min-width: 0; cursor: pointer; }
#player .mt { font-size: var(--t-md); font-weight: 600; white-space: nowrap; overflow: hidden; mask-image: linear-gradient(90deg, #000 85%, transparent); }
/* while gliding, both edges fade; the padding keeps the resting text where it was */
#player .mt.scroll { padding-inline-start: 6px; margin-inline-start: -6px; mask-image: linear-gradient(90deg, transparent, #000 6px, #000 calc(100% - 20px), transparent); }
@media (prefers-reduced-motion: no-preference) {
  #player .meta.swap { animation: meta-in 320ms var(--ease); }
  #player button { transition: scale 120ms var(--ease), color 150ms var(--ease), background-color 150ms var(--ease); }
  #player button:active { scale: 0.92; }
}
@keyframes meta-in { from { opacity: 0; translate: 0 4px; filter: blur(2px); } }
/* video tabs: music only and picture in picture take the EQ's place */
.vbtn { display: none; width: 26px; height: 26px; border-radius: 6px; flex: none; color: var(--fg2); }
#player.is-video .vbtn { display: grid; }
#player.is-video .eq { display: none; }
.vbtn[aria-pressed="true"] { color: var(--fg); background: var(--field); }
@media (hover: hover) { .vbtn:hover { color: var(--fg); background: var(--hover); } }
#player .mt span { display: inline-block; }
@media (prefers-reduced-motion: no-preference) { #player .mt.scroll span { animation: marquee var(--dur, 8s) linear infinite alternate; } }
@keyframes marquee { 0%, 15% { translate: 0 0; } 85%, 100% { translate: var(--dist, 0px) 0; } }
#player .ma { font-size: var(--t-xs); color: var(--fg2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 1px; }
.eq { display: inline-flex; align-items: flex-end; gap: 1px; height: 11px; flex: none; }
/* four 2px pixels per column, lit in whole steps */
.eq i { width: 2px; height: 11px; background: repeating-linear-gradient(to top, var(--fg) 0 2px, transparent 2px 3px); clip-path: inset(72.7% 0 0 0); }
@media (prefers-reduced-motion: no-preference) {
  .playing .eq i { animation: eq-a 1.2s steps(1) infinite; }
  .playing .eq i:nth-child(2) { animation-name: eq-b; animation-duration: 0.9s; }
  .playing .eq i:nth-child(3) { animation-name: eq-c; animation-duration: 1.4s; }
  .playing .eq i:nth-child(4) { animation-name: eq-b; animation-duration: 1.05s; animation-delay: -0.4s; }
}
@keyframes eq-a { 0% { clip-path: inset(45.5% 0 0 0); } 20% { clip-path: inset(0 0 0 0); } 40% { clip-path: inset(18.2% 0 0 0); } 60% { clip-path: inset(72.7% 0 0 0); } 80% { clip-path: inset(18.2% 0 0 0); } }
@keyframes eq-b { 0% { clip-path: inset(18.2% 0 0 0); } 25% { clip-path: inset(72.7% 0 0 0); } 50% { clip-path: inset(0 0 0 0); } 75% { clip-path: inset(45.5% 0 0 0); } }
@keyframes eq-c { 0% { clip-path: inset(72.7% 0 0 0); } 17% { clip-path: inset(45.5% 0 0 0); } 33% { clip-path: inset(0 0 0 0); } 50% { clip-path: inset(18.2% 0 0 0); } 67% { clip-path: inset(45.5% 0 0 0); } 83% { clip-path: inset(0 0 0 0); } }
#m-bar { position: relative; height: 14px; display: flex; align-items: center; cursor: pointer; margin-inline: 4px; }
#m-bar::before { content: ''; position: absolute; inset-inline: 0; height: 3px; border-radius: 2px; background: var(--line); transition: height 150ms var(--ease); }
#m-fill { position: relative; height: 3px; border-radius: 2px; background: var(--fg); width: 0; transition: width 1s linear, height 150ms var(--ease); }
#m-fill::after { content: ''; position: absolute; inset-inline-end: -5px; top: 50%; width: 10px; height: 10px; border-radius: 50%; background: var(--fg); translate: 0 -50%; scale: 0; transition: scale 150ms var(--ease); }
@media (hover: hover) { #m-bar:hover::before, #m-bar:hover #m-fill { height: 5px; } #m-bar:hover #m-fill::after { scale: 1; } }
#m-bar:focus-visible #m-fill::after { scale: 1; }
#player .times { display: flex; justify-content: space-between; margin: -6px 4px 0; font-size: var(--t-xs); color: var(--fg2); font-variant-numeric: tabular-nums; }
#player .ctl { display: flex; align-items: center; justify-content: space-between; }
#player .ctl .icon-btn { width: 28px; height: 28px; color: var(--fg2); }
@media (hover: hover) { #player .ctl .icon-btn:hover { color: var(--fg); } }
#m-play { position: relative; width: 36px; height: 36px; border-radius: 50%; background: var(--fg); color: var(--bg); }
@media (hover: hover) { #m-play:hover { background: var(--fg); } }
#m-play svg { position: absolute; width: 16px; height: 16px; fill: currentColor; stroke: none; transition: opacity 200ms var(--ease), scale 200ms var(--ease), filter 200ms var(--ease); }
#player.playing #m-play .i-play, #player:not(.playing) #m-play .i-pause { opacity: 0; scale: 0.25; filter: blur(4px); }
#m-mute svg path { transition: opacity 150ms var(--ease); }
#player.muted #m-mute .i-wave, #player:not(.muted) #m-mute .i-x { opacity: 0; }
.sound { width: 24px; height: 24px; color: var(--fg2); flex: none; }
@media (hover: hover) { .sound:hover { color: var(--fg); } }

/* ---------- AI agent badge ---------- */
#agent { flex: none; display: none; align-items: center; gap: 8px; margin-top: 8px; padding: 8px 12px; border-radius: 8px; font-size: var(--t-sm); box-shadow: inset 0 0 0 1px var(--line); }
.agent-on #agent { display: flex; }
#agent .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--fg); }
@media (prefers-reduced-motion: no-preference) { #agent .dot { animation: pulse 1.2s ease-in-out infinite; } }
@keyframes pulse { 50% { opacity: 0.25; } }

/* ---------- profile avatar & sign-up / lock screen ---------- */
#b-profile { width: 28px; height: 28px; flex: none; }
/* Private window: the avatar becomes a "Private" pill, so it's always clear which window this is. */
.private #b-profile { width: auto; gap: 6px; padding-inline: 8px 10px; height: 26px; border-radius: 13px; background: var(--fg); color: var(--bg); font-size: var(--t-xs); cursor: default; }
.private #b-profile svg { width: 14px; height: 14px; }
.private #b-profile b { font-weight: 600; }
#b-profile span, .avatar { display: grid; place-items: center; width: 22px; height: 22px; border-radius: 50%; background: var(--fg); color: var(--bg); font-size: var(--t-xs); font-weight: 600; }
/* In the bar the avatar is a control among icons: a quiet chip, not the brightest thing in the row. */
#b-profile span { width: 20px; height: 20px; background: var(--field); color: var(--fg); box-shadow: inset 0 0 0 1px var(--line); transition: background-color 150ms var(--ease); }
@media (hover: hover) { #b-profile:hover span { background: var(--press); } }
#gate { position: fixed; inset: 0; z-index: 4; display: none; place-items: center; background: var(--bg); }
.gated #gate, .new-profile #gate { display: grid; }
.new-profile #gate { background: var(--scrim); }
.gated #sidebar, .gated #frame, .gated #ai, .gated #edge { display: none; }
#gate form { width: min(340px, calc(100vw - 32px)); display: flex; flex-direction: column; gap: 10px; padding: 28px; border-radius: 16px; background: var(--raised); box-shadow: 0 0 0 1px var(--line), 0 16px 48px oklch(0 0 0 / 0.18); text-align: center; }
#gate .avatar { width: 52px; height: 52px; border-radius: 50%; font-size: 22px; margin: 0 auto 6px; }
#gate h1 { font-size: 20px; font-weight: 600; letter-spacing: -0.01em; }
#gate .sub { color: var(--fg2); margin-bottom: 8px; }
#gate input { height: 38px; border-radius: 8px; background: var(--field); padding-inline: 12px; text-align: start; }
#gate .err { color: var(--fg); font-size: var(--t-sm); min-height: 16px; }
#gate .primary { height: 38px; border-radius: 8px; background: var(--fg); color: var(--bg); font-weight: 600; }
#gate .link { height: 30px; color: var(--fg2); font-size: var(--t-sm); }
@media (hover: hover) { #gate .primary:hover { background: var(--fg); opacity: 0.9; } }

#emptymsg h1, .intro h2, #keycard h2, #gate h1 { text-wrap: balance; }
#emptymsg p, .intro p, #keycard p, #gate .sub { text-wrap: pretty; line-height: 1.45; }

.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>

(() => {
  const $ = (s) => document.querySelector(s);
  const send = (o) => window.ipc.postMessage(JSON.stringify(o));
  const env = window.__RZEN || { platform: 'macos', overlay: true };
  const body = document.body;

  function setFav(el, icon, url) {

  // Keyed reconciliation: reuses nodes so favicons never reload and hover state survives.
  function reconcile(container, items, make, update) {
    const existing = new Map([...container.children].map((el) => [el.dataset.id, el]));
    let prev = null;
    for (const it of items) {
      const key = String(it.id);
      let el = existing.get(key);
      if (el) existing.delete(key); else { el = make(it); el.dataset.id = key; }
      update(el, it);
      const want = prev ? prev.nextSibling : container.firstChild;
      if (el !== want) container.insertBefore(el, want);
      prev = el;
    }
    existing.forEach((el) => el.remove());
  }

  function wireTab(el, id) {

    el.addEventListener('contextmenu', (e) => { e.preventDefault(); send({ t: 'tabCtx', id, x: e.clientX, y: e.clientY }); });
    el.addEventListener('pointerdown', (e) => {

    });
    el.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); send({ t: 'select', id }); }
      else if (e.key === 'Delete' || e.key === 'Backspace') { e.preventDefault(); send({ t: 'close', id }); }
      else if (e.key === 'ArrowDown' || e.key === 'ArrowUp' || e.key === 'ArrowRight' || e.key === 'ArrowLeft') {

  // ---------- now playing: pixel effects ----------
  // While something plays, square pixels rise and fall behind the player like an LED spectrum,
  // and the cover art is a mosaic that sharpens when playback starts and coarsens on pause.
  // The spectrum is an animation that follows play/pause; pages don't expose their actual sound.
  const fx = { playing: false, lv: [], pk: [], raf: 0, last: 0 };
  const fxShown = () => body.classList.contains('has-media') && !document.hidden && !reduceMotion.matches
    && (!body.classList.contains('compact') || body.classList.contains('peek'));
  function fxSync() {
    if (!fx.raf && fxShown() && (fx.playing || fx.lv.some((v) => v > 0.01))) fx.raf = requestAnimationFrame(fxFrame);
  }
  function fxFrame(now) {
    fx.raf = 0;
    const c = $('#m-fx'), w = c.clientWidth, h = c.clientHeight, dpr = devicePixelRatio || 1;
    if (!fxShown() || !w || !h) return;
    if (now - fx.last < 30) { fx.raf = requestAnimationFrame(fxFrame); return; } // ~30 fps is plenty
    const dt = fx.last ? Math.min(now - fx.last, 100) : 33;
    fx.last = now;
    if (c.width !== Math.round(w * dpr) || c.height !== Math.round(h * dpr)) { c.width = Math.round(w * dpr); c.height = Math.round(h * dpr); }
    // a band behind the controls row only, so it never runs under the text or the timeline
    const P = 4, S = 5, cols = Math.floor((w + 1) / S), rows = Math.floor(Math.min(h * 0.6, 56) / S), ox = (w - (cols * S - 1)) / 2;
    const t = now / 1000, beat = Math.exp(-((t * 2) % 1) * 5); // a soft 120 bpm pulse
    for (let i = 0; i < cols; i++) {
      const x = i / Math.max(1, cols - 1);
      const wave = 0.55 + 0.45 * Math.sin(t * (1.9 + ((i * 7) % 5) * 0.41) + i * 1.7);
      const target = fx.playing ? Math.min(1, Math.max(0, (0.8 - 0.45 * x) * (0.5 + 0.5 * beat * (1 - 0.6 * x)) * wave + (Math.random() - 0.5) * 0.14)) : 0;
      const cur = fx.lv[i] || 0;
      fx.lv[i] = cur + (target - cur) * Math.min(1, dt / (target > cur ? 50 : 240)); // quick rise, slow fall
      fx.pk[i] = Math.max(fx.lv[i], (fx.pk[i] || 0) - dt / 1500);
    }
    fx.lv.length = fx.pk.length = cols;
    const g = c.getContext('2d');
    g.setTransform(dpr, 0, 0, dpr, 0, 0);
    g.clearRect(0, 0, w, h);
    g.fillStyle = getComputedStyle(document.documentElement).getPropertyValue('--fg').trim();
    for (let i = 0; i < cols; i++) {
      const n = Math.round(fx.lv[i] * rows), p = Math.round(fx.pk[i] * rows), x = ox + i * S;
      for (let r = 0; r < n; r++) { g.globalAlpha = 0.11 * (1 - (r / rows) * 0.55); g.fillRect(x, h - (r + 1) * S, P, P); }
      if (p > n) { g.globalAlpha = 0.18; g.fillRect(x, h - p * S, P, P); }
    }
    if (fx.playing || fx.lv.some((v) => v > 0.01) || fx.pk.some((v) => v > 0.01)) fx.raf = requestAnimationFrame(fxFrame);
    else g.clearRect(0, 0, w, h);
  }
  document.addEventListener('visibilitychange', fxSync);

  // Cover art as a pixel mosaic: n×n cells, 10 while playing, 5 when paused, stepping between.
  const mosaic = { img: null, n: 0, timer: 0 };
  function mosaicDraw() {
    const cv = $('#m-art canvas'), img = mosaic.img, n = mosaic.n;
    if (!cv || !img || !n) return;
    const W = Math.round((cv.clientWidth || 40) * (devicePixelRatio || 1));
    if (cv.width !== W) cv.width = cv.height = W;
    const small = mosaicDraw.small || (mosaicDraw.small = document.createElement('canvas'));
    small.width = small.height = n;
    const side = Math.min(img.naturalWidth, img.naturalHeight);

  // Small, safe Markdown: escape first, then format.
  function markdown(src) {
    const esc = (t) => t.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    const inline = (t) => esc(t)
      .replace(/`([^`]+)`/g, '<code>$1</code>')
      .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
      .replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g, '<a data-href="$2">$1</a>');
    const out = [];
    const parts = String(src).split(/```[^\n]*\n?/);
    parts.forEach((part, i) => {
      if (i % 2) { out.push('<pre><code>' + esc(part.replace(/\n$/, '')) + '</code></pre>'); return; }
      for (const para of part.split(/\n{2,}/)) {
        const lines = para.split('\n').filter((l) => l.trim());
        if (!lines.length) continue;
        if (lines.every((l) => /^\s*([-*]|\d+\.)\s+/.test(l))) {
          const ordered = /^\s*\d+\./.test(lines[0]);
          out.push((ordered ? '<ol>' : '<ul>') + lines.map((l) => '<li>' + inline(l.replace(/^\s*([-*]|\d+\.)\s+/, '')) + '</li>').join('') + (ordered ? '</ol>' : '</ul>'));
        } else {
          out.push('<p>' + lines.map((l) => /^#{1,6}\s/.test(l) ? '<strong>' + inline(l.replace(/^#+\s*/, '')) + '</strong>' : inline(l)).join('<br>') + '</p>');
        }
      }
    });
    return out.join('');
  }

  const bezier = (x1, y1, x2, y2) => (t) => {
    let x = t;
    for (let i = 0; i < 8; i++) {

      const dx = 3 * x1 * (1 - x) ** 2 + 6 * (x2 - x1) * x * (1 - x) + 3 * (1 - x2) * x * x;
      if (Math.abs(fx) < 1e-5 || !dx) break;

  function openPalette(o) {
    if (o.history) {
      H = o.history.map(([url, title, score, icon]) => ({ url, title, score, icon, host: shortHost(url).toLowerCase(), key: (url + ' ' + title).toLowerCase() }));
    }
    T = (o.tabs || []).map(([id, title, url, icon, space, visible]) => ({ id, title: title || shortHost(url), url, icon, space: space || '', visible, key: (title + ' ' + url + ' ' + (space || '')).toLowerCase() }));
    // ⌃P again while the switcher is open steps down the list (the menu shortcut wins over the input).
    if (body.classList.contains('palette') && o.mode === mode && (mode === 'tabs' || mode === 'commands')) {
      if (items.length) { sel = (sel + 1) % items.length; renderResults(); }
      return;
    }
    mode = o.mode;
    body.classList.add('palette');
    pin.placeholder = PH[mode] || PH.new;
    pin.setAttribute('aria-label', pin.placeholder);
    pin.value = o.value || '';
    pin.focus(); pin.select();
    update(mode === 'edit' ? null : '');
  }
  function closePalette(notify) {
    if (!body.classList.contains('palette')) return;
    body.classList.remove('palette');
    pin.blur();
    if (notify) send({ t: 'paletteClose' });
  }

  function renderResults() {
    results.textContent = '';
    items.forEach((it, i) => {
      const row = document.createElement('div');
      row.className = 'res';
      row.id = 'res-' + i;
      row.setAttribute('role', 'option');
      row.setAttribute('aria-selected', String(i === sel));
      const fav = document.createElement('div');
      fav.className = 'fav';
      fav.setAttribute('aria-hidden', 'true');
      if (it.kind === 'cmd') fav.innerHTML = ICON[it.glyph] || ICON.gear;
      else if (it.icon || (it.kind === 'tab' && isInternal(it.url))) setFav(fav, it.icon, it.url);
      else fav.innerHTML = it.kind === 'search' ? ICON.search : it.kind === 'history' ? ICON.clock : it.kind === 'tab' ? ICON.tab : ICON.globe;
      const t = document.createElement('div'); t.className = 't';
      const u = document.createElement('div'); u.className = 'u';
      const h = document.createElement('div'); h.className = 'hint';
      if (it.kind === 'search') { t.textContent = it.title; u.textContent = 'Search'; }
      else if (it.kind === 'cmd') { t.textContent = it.title; }
      else { t.textContent = it.title || shortHost(it.url); u.textContent = it.kind === 'url' ? '' : isInternal(it.url) ? '' : shortHost(it.url); }
      if (it.kind === 'cmd') { h.textContent = it.keys || (i === sel ? '↵' : ''); if (it.keys) h.classList.add('keys'); }
      else if (it.where !== undefined) h.textContent = it.where;
      else h.textContent = it.kind === 'tab' ? 'Switch to tab' : (i === sel ? '↵' : '');
      row.append(fav, t, u, h);
      row.addEventListener('mousemove', () => { if (sel !== i) { sel = i; renderResults(); } });
      row.addEventListener('mousedown', (e) => { e.preventDefault(); sel = i; submit(); });
      results.appendChild(row);
    });
    pin.setAttribute('aria-activedescendant', items.length ? 'res-' + sel : '');
    document.getElementById('res-' + sel)?.scrollIntoView({ block: 'nearest' });
  }

  function submit() {
    const it = items[sel];
    const value = pin.value.trim();
    const v = view(pin.value)[0];
    closePalette(false);
    if (it && it.kind === 'cmd') { remember(it.id); send({ t: 'command', id: it.id }); return; }
    if (v !== 'web') { send(it && it.kind === 'tab' ? { t: 'go', mode, value: '', tab: it.id } : { t: 'paletteClose' }); return; }
    if (it && sel > 0) {
      if (it.kind === 'tab') send({ t: 'go', mode, value: '', tab: it.id });
      else if (it.kind === 'search') send({ t: 'go', mode, value: it.title, tab: null, search: true });
      else send({ t: 'go', mode, value: it.url, tab: null });
    } else if (value) send({ t: 'go', mode, value, tab: null });
    else if (it) send(it.kind === 'tab' ? { t: 'go', mode, value: '', tab: it.id } : { t: 'go', mode, value: it.url, tab: null });
    else send({ t: 'paletteClose' });
  }

  pin.addEventListener('input', (e) => update(pin.value, e));
  pin.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowDown' || (e.key === 'n' && e.ctrlKey)) { e.preventDefault(); sel = Math.min(items.length - 1, sel + 1); renderResults(); }
    else if (e.key === 'p' && e.ctrlKey && mode === 'tabs') { e.preventDefault(); if (items.length) { sel = (sel + 1) % items.length; renderResults(); } }
    else if (e.key === 'ArrowUp' || (e.key === 'p' && e.ctrlKey)) { e.preventDefault(); sel = Math.max(0, sel - 1); renderResults(); }
    else if (e.key === 'Enter') { e.preventDefault(); submit(); }
    else if (e.key === 'Escape') { e.preventDefault(); closePalette(true); }
  });
  $('#backdrop').addEventListener('mousedown', () => closePalette(true));

  // ---------- find in page ----------
  const fin = $('#finput'), fbar = $('#findbar');
  const findSend = (back, again) => { if (fin.value) send({ t: 'find', q: fin.value, back, again }); else fbar.classList.remove('miss'); };
  fin.addEventListener('input', () => findSend(false, false));
  fin.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') { e.preventDefault(); findSend(e.shiftKey, true); }
    if (e.key === 'Escape') { e.preventDefault(); send({ t: 'findClose' }); }
  });
  $('#f-next').addEventListener('click', () => findSend(false, true));
  $('#f-prev').addEventListener('click', () => findSend(true, true));
  $('#f-close').addEventListener('click', () => send({ t: 'findClose' }));

  // ---------- API called from Rust ----------
  window.__rzen = {
    state(s) { S = s; render(); },
    palette: openPalette,
    setSidebar,
    aiKey(key) { assistant.key = key || null; msgs.innerHTML = ''; assistant.ready(); },
    aiPrompt(text) { if (S && S.ai.provider === 'assistant') assistant.ask(text); },
    mediaTime([pos, dur, playing, ratio]) {
      mediaPos = pos; mediaDur = dur;
      if (ratio > 0) {
        const r = Math.min(2.6, Math.max(0.5, ratio)), slot = $('#m-video');
        if (slot.style.getPropertyValue('--mv-ratio') !== String(r.toFixed(3))) {
          slot.style.setProperty('--mv-ratio', r.toFixed(3));
          slot.style.setProperty('--mv-max', Math.round(240 * r) + 'px');
        }
      }
      fx.playing = playing;
      fxSync();
      $('#m-fill').style.width = dur ? Math.min(100, (pos / dur) * 100) + '%' : '0';
      $('#m-pos').textContent = fmt(pos);
      $('#m-dur').textContent = dur ? fmt(dur) : 'Live';
      bar.setAttribute('aria-valuenow', String(dur ? Math.round((pos / dur) * 100) : 0));
      bar.setAttribute('aria-valuetext', fmt(pos) + (dur ? ' of ' + fmt(dur) : ''));
      $('#player').classList.toggle('playing', playing);
    },
    toolResult(id, ok, value) { const c = assistant.calls.get(id); if (c) { assistant.calls.delete(id); c.resolve({ ok, value }); } },
    newProfile() { body.classList.add('new-profile'); renderGate('new'); },
    gateError(msg) { $('#g-err').textContent = msg; $('#g-pass').select(); },
    renameWs(id) { if (S && S.activeWs === id) startRename(); else { pendingRename = id; send({ t: 'ws', id }); } },
    find() { body.classList.add('finding'); fin.focus(); fin.select(); if (fin.value) findSend(false, false); },
    findStep(back) { findSend(back, true); },
    findResult(found) { fbar.classList.toggle('miss', !found); },
  };
  send({ t: 'ready' });
})();
</script>
</body>
</html>
